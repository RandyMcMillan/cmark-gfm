name: Rust FFI release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gfm-lint
  LIB_NAME: gfm_linter

jobs:
  build-release:
    name: Build release FFI artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
            binary_ext: .exe

    defaults:
      run:
        working-directory: linter

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation targets)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linter/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-ffi-release-${{ hashFiles('linter/Cargo.lock', 'linter/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-ffi-release-

      - name: Build release artifacts (native)
        if: matrix.cross != true
        run: cargo build --release --features cmark-gfm-ffi --target ${{ matrix.target }} --verbose

      - name: Build release artifacts (cross)
        if: matrix.cross == true
        run: cross build --release --features cmark-gfm-ffi --target ${{ matrix.target }} --verbose

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          BINARY="${{ env.BINARY_NAME }}${{ matrix.binary_ext }}"
          BIN_SRC="target/${{ matrix.target }}/release/${BINARY}"
          BIN_DEST="${{ env.BINARY_NAME }}-${{ matrix.artifact_suffix }}${{ matrix.binary_ext }}"
          cp "${BIN_SRC}" "../../${BIN_DEST}"

          mapfile -t LIB_CANDIDATES < <(compgen -G "target/${{ matrix.target }}/release/deps/lib${{ env.LIB_NAME }}-*.rlib")
          if [ "${#LIB_CANDIDATES[@]}" -eq 0 ]; then
            echo "No Rust library artifact found for ${{ matrix.target }}" >&2
            exit 1
          fi
          LIB_DEST="lib${{ env.LIB_NAME }}-${{ matrix.artifact_suffix }}.rlib"
          cp "${LIB_CANDIDATES[0]}" "../../${LIB_DEST}"

          {
            echo "ARTIFACT_BIN=${BIN_DEST}"
            echo "ARTIFACT_LIB=${LIB_DEST}"
          } >> "${GITHUB_ENV}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-ffi-${{ matrix.artifact_suffix }}
          path: |
            ${{ env.ARTIFACT_BIN }}
            ${{ env.ARTIFACT_LIB }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Release ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true
