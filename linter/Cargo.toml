[package]
name = "gfm-linter"
version = "0.1.0"
edition = "2021"
description = "A Rust markdown linter that enforces the GitHub Flavored Markdown specification"
license = "BSD-2-Clause"

[lib]
name = "gfm_linter"
path = "src/lib.rs"

[[bin]]
name = "gfm-lint"
path = "src/main.rs"

[features]
## Compile the bundled cmark-gfm C library and expose raw FFI bindings
## together with ergonomic safe Rust wrappers.
cmark-gfm-ffi = ["dep:cc"]

[dependencies]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
